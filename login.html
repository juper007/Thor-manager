<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thor Login</title><style>
:root{color-scheme:dark;--bg:#070a0c;--panel:#11171b;--line:#273138;--green:#76b900;--text:#f2f6f7;--muted:#829099}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 0,#172115,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif}.login{width:min(420px,calc(100% - 32px));padding:34px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,#12191d,#0b0f12);box-shadow:0 24px 70px #0008}.eyebrow{color:var(--green);font:800 10px monospace;letter-spacing:2px}h1{margin:7px 0 26px;font-size:32px}h1 span{font-weight:300;color:#9aa4aa}label{display:grid;gap:7px;margin:15px 0;color:var(--muted);font-size:11px;letter-spacing:1px}input{width:100%;padding:13px;background:#090d0f;border:1px solid var(--line);border-radius:4px;color:var(--text);font:14px inherit}input:focus{outline:2px solid var(--green);outline-offset:1px}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:4px;background:var(--green);color:#0b0e09;font:800 11px monospace;letter-spacing:1.5px;cursor:pointer}button:disabled{opacity:.5}.error{min-height:20px;margin-top:14px;color:#ff7777;font-size:12px}</style></head><body><main class="login"><p class="eyebrow">NVIDIA JETSON · SECURE ACCESS</p><h1>THOR <span>LOGIN</span></h1><form id="loginForm"><label>USERNAME<input id="username" name="username" autocomplete="username" required autofocus></label><label>PASSWORD<input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="submit">SIGN IN</button><p class="error" id="error" role="alert"></p></form></main><script>
const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error');function safeNext(){try{const target=new URL(new URLSearchParams(location.search).get('next')||'/ai',location.origin);return target.origin===location.origin?target.pathname+target.search+target.hash:'/ai'}catch{return'/ai'}}form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Login failed');location.replace(safeNext())}catch(exc){error.textContent=exc.message;button.disabled=false}};
</script></body></html>
